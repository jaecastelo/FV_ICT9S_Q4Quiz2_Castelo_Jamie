<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Score Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background-color: #f9f9f9;
    }

    h1 {
      background-color: #F37199;
      padding: 20px;
      margin: 0;
      font-family: 'cursive';
    }

    .toggle-btn {
      margin-top: 15px;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      background: none;
      border: none;
      font-weight: bold;
    }

    .toggle-text {
      display: none;
      font-size: 14px;
      color: #444;
      margin: 10px auto;
      width: 60%;
      background-color: #FFDEDE;
      padding: 10px;
      border-radius: 8px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 30px;
      flex-wrap: wrap;
    }

    .card {
      border-radius: 10px;
      background-color: #fff;
      padding: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 180px;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .grade-input {
      margin-top: 10px;
    }

    input[type="number"] {
      width: 80px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }

    .btn {
      margin-top: 20px;
      background-color: #F7A8C4;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
      font-style: italic;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>
<body>

  <h1>Score Analyzer</h1>

  <button class="toggle-btn" onclick="toggleText()">▼ Click Me</button>

  <div class="toggle-text" id="clickMeText">
    Enter your grades in the following subjects.
  </div>

  <div class="container">
    <div class="card">
      <img src="file:///Users/admin/Desktop/Screenshot%202025-04-30%20at%209.29.01%E2%80%AFAM.png" alt="Science">
      <div class="grade-input">
        <input type="number" id="science" placeholder="Science" min="0" max="100" value="87">
      </div>
    </div>
    <div class="card">
      <img src="file:///Users/admin/Desktop/Screenshot%202025-04-30%20at%209.28.54%E2%80%AFAM.png" alt="Math">
      <div class="grade-input">
        <input type="number" id="math" placeholder="Math" min="0" max="100" value="88">
      </div>
    </div>
    <div class="card">
      <img src="file:///Users/admin/Desktop/Screenshot%202025-04-30%20at%209.27.22%E2%80%AFAM.png" alt="English">
      <div class="grade-input">
        <input type="number" id="english" placeholder="English" min="0" max="100" value="92">
      </div>
    </div>
  </div>

  <button class="btn" onclick="getRating()">Get Rating</button>

  <div class="note">
    <p>Note: Grading Criteria and Equivalents can vary depending on school or district.</p>
  </div>

  <footer>By Jamieeee</footer>

  <script>
    function getRating() {
      const sci = Number(document.getElementById('science').value);
      const math = Number(document.getElementById('math').value);
      const eng = Number(document.getElementById('english').value);

      
      if (isNaN(sci) || isNaN(math) || isNaN(eng)) {
        alert("Please enter all grades.");
        return;
      }

      const avg = ((sci + math + eng) / 3).toFixed(2);
      let rating = "";

    
      switch (true) {
        case (avg >= 90):
          rating = "Outstanding";
          break;
        case (avg >= 85):
          rating = "Above Satisfactory";
          break;
        case (avg >= 75):
          rating = "Satisfactory";
          break;
        default:
          rating = "Needs Improvement";
      }

      alert(`Your average is ${avg} - ${rating}`);
    }
    
    function toggleText() {
      var text = document.getElementById("clickMeText");
      var btn = document.querySelector(".toggle-btn");
      if (text.style.display === "none" || text.style.display === "") {
        text.style.display = "block";
        btn.innerHTML = "▲ Hide Text";
      } else {
        text.style.display = "none";
        btn.innerHTML = "▼ Click Me";
      }
    }
  </script>

</body>
</html>
